version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: cm-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: contract_mgmt
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    ports:
      - "3306:3306"
    volumes:
      - cm-mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: cm-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis123456}"]
    ports:
      - "6379:6379"
    volumes:
      - cm-redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: cm-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cm-minio-data:/data

volumes:
  cm-mysql-data:
  cm-redis-data:
  cm-minio-data:
