# Contract Management 站点配置（由 ops/install.sh 生成）
# 占位变量：APP_DOMAIN、FRONTEND_ROOT、LISTEN_DIRECTIVES、SSL_BLOCK、HTTP_REDIRECT_SERVER
# 安装时由 envsubst 渲染，含字面量 "\n" 的多行变量会被 sed 还原为真换行

upstream contract_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP -> HTTPS 跳转（仅在配置了证书时启用）
${HTTP_REDIRECT_SERVER}

server {
${LISTEN_DIRECTIVES}
    server_name ${APP_DOMAIN};

${SSL_BLOCK}

    client_max_body_size 200m;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root ${FRONTEND_ROOT};
    index index.html;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 带 hash 的静态资源长期缓存
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后端 API
    location /api/ {
        proxy_pass         http://contract_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout   60s;
        proxy_read_timeout   60s;
    }

    # Swagger / Actuator / MinIO 控制台：仅内网
    location ~ ^/(swagger-ui|v3/api-docs|actuator)/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://contract_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MinIO 控制台代理（可选；默认仅内网）
    location /minio-console/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/minio-console/(.*) /$1 break;
    }

    access_log /var/log/nginx/contract-access.log;
    error_log  /var/log/nginx/contract-error.log warn;
}
